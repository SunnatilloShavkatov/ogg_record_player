name: ogg_record_player
version: 2.7.1
description: "Play and record Ogg Opus audio on Android and iOS with a simple Flutter API."
homepage: https://github.com/SunnatilloShavkatov/ogg_record_player
repository: https://github.com/SunnatilloShavkatov/ogg_record_player
issue_tracker: https://github.com/SunnatilloShavkatov/ogg_record_player/issues
topics:
  - audio
  - opus
  - ogg
  - recorder
  - voice-message

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  analysis_lints: ^1.1.1
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: OggRecordPlayerPlugin
        sharedDarwinSource: true
      android:
        package: uz.plugin.ogg_record_player
        pluginClass: OggRecordPlayerPlugin
