name: ogg_record_player
version: 2.3.0
description: "Play and record Ogg Opus audio on Android, iOS and macOS with a simple Flutter API."
homepage: https://github.com/SunnatilloShavkatov/ogg_record_player

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  analysis_lints: ^1.1.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: OggOpusPlayerPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: OggOpusPlayerPlugin
        sharedDarwinSource: true
      android:
        package: uz.plugin.ogg_opus_player
        pluginClass: OggOpusPlayerPlugin
