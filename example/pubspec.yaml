name: ogg_record_player_example
version: 1.0.0+1
publish_to: "none"
description: "Example app demonstrating Ogg Opus audio playback and recording with ogg_record_player."

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  ogg_record_player:
    path: ../
  path_provider: ^2.1.6
  permission_handler: ^13.0.2

dev_dependencies:
  analysis_lints: ^1.1.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  patrol: ^4.11.0

flutter:
  uses-material-design: true

  assets:
    - audios/test.ogg

patrol:
  app_name: Ogg Opus Player
  test_directory: patrol_test
  android:
    package_name: uz.plugin.ogg_record_player_example
  ios:
    bundle_id: uz.plugin.oggOpusPlayerExample
